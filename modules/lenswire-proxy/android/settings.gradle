// IDE / Kotlin language-server root only.
// Ignored when this module is included from the app android/ project via Expo autolinking.
pluginManagement {
  repositories {
    google()
    mavenCentral()
    gradlePluginPortal()
  }
  plugins {
    id 'com.android.library' version '8.12.0'
    id 'org.jetbrains.kotlin.android' version '2.1.20'
  }
}

dependencyResolutionManagement {
  repositoriesMode.set(RepositoriesMode.PREFER_SETTINGS)
  repositories {
    google()
    mavenCentral()
    maven { url 'https://www.jitpack.io' }
  }
}

rootProject.name = 'lenswire-proxy'
