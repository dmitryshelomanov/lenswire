name: Feature request
description: Suggest an improvement or new capability
title: '[Feature]: '
labels: ['enhancement']
body:
  - type: markdown
    attributes:
      value: |
        Describe the problem first. Keep scope realistic — Lenswire is a local MITM inspector (Packet Tunnel / VpnService), not a general VPN or pinning bypass product.

  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do that is hard or impossible today?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: How you would like it to work
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Workarounds or other approaches you already tried

  - type: dropdown
    id: platform
    attributes:
      label: Platform relevance
      options:
        - iOS
        - Android
        - Both
        - Tooling / docs
    validations:
      required: true

  - type: textarea
    id: extra
    attributes:
      label: Additional context
      description: Screenshots, related issues, or links
